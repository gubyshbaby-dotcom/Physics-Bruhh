name: Probe

# A quick look at the game's API and a compile check, for the branch "probe" only:
# no native build, no tests. What to print is listed in tools/probe.txt.
on:
  push:
    branches: [probe]

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    name: API reference and compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Game artifacts
        run: |
          ./gradlew createMinecraftArtifacts -PskipCargo=true > artifacts.log 2>&1 || tail -30 artifacts.log
          ls -la build/moddev/artifacts/ || true
      - name: Compile check
        run: |
          if ./gradlew compileJava -PskipCargo=true > compile.log 2>&1; then echo "COMPILE OK"; else echo "COMPILE FAILED"; grep -E "error:|warning: \[|\.java:[0-9]+" -A 3 compile.log | head -300; tail -15 compile.log; fi
      - name: Print what tools/probe.txt asks for
        run: bash tools/probe.sh
