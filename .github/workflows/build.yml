name: Build

on:
  push:
    branches-ignore: [probe, 'iris**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, platform: linux-x86_64,   lib: libphysicsbruhh_native.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   platform: windows-x86_64, lib: physicsbruhh_native.dll }
          - { os: macos-latest,   target: aarch64-apple-darwin,     platform: macos-aarch64,  lib: libphysicsbruhh_native.dylib }
          - { os: macos-latest,   target: x86_64-apple-darwin,      platform: macos-x86_64,   lib: libphysicsbruhh_native.dylib }
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('native/Cargo.toml') }}
      - name: Test the simulation core
        if: matrix.platform == 'linux-x86_64'
        working-directory: native
        run: |
          cargo test --release
          PHYSICSBRUHH_THREADS=4 cargo test --release
      - name: Threads and wide registers change the speed, not the result
        if: matrix.platform == 'linux-x86_64'
        working-directory: native
        run: |
          cargo build --release --example bench
          echo "cores: $(nproc), $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"; lscpu | grep -E 'Thread|Core|Socket' || true
          for t in 1 2 4; do PHYSICSBRUHH_THREADS=$t ./target/release/examples/bench 8 3 > bench-$t.txt; head -2 bench-$t.txt; done
          tail -1 bench-1.txt
          test "$(tail -1 bench-1.txt)" = "$(tail -1 bench-2.txt)"
          test "$(tail -1 bench-1.txt)" = "$(tail -1 bench-4.txt)"
          # a lake of honey: every piece joined to its neighbours by springs, which take turns in rounds
          for t in 1 2 4; do PHYSICSBRUHH_THREADS=$t ./target/release/examples/bench 12 2 lake > lake-$t.txt; head -2 lake-$t.txt; done
          # ... and the same one neighbour at a time instead of eight
          PHYSICSBRUHH_PLAIN=1 PHYSICSBRUHH_THREADS=4 ./target/release/examples/bench 12 2 lake > lake-plain.txt; head -2 lake-plain.txt
          tail -1 lake-1.txt
          test "$(tail -1 lake-1.txt)" = "$(tail -1 lake-2.txt)"
          test "$(tail -1 lake-1.txt)" = "$(tail -1 lake-4.txt)"
          test "$(tail -1 lake-1.txt)" = "$(tail -1 lake-plain.txt)"
          # how it goes with a lot of goo on this machine
          PHYSICSBRUHH_THREADS=4 ./target/release/examples/bench 60 2 lake | head -14
      - name: Build
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          mkdir -p stage/natives/${{ matrix.platform }}
          cp native/target/${{ matrix.target }}/release/${{ matrix.lib }} stage/natives/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: stage/
          retention-days: 7

  mod:
    name: Mod jar (NeoForge)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: src/main/resources/
      - name: List bundled natives
        run: find src/main/resources/natives -type f | sort
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Java and Rust simulations agree
        run: |
          mkdir -p build/simcheck
          javac -nowarn -d build/simcheck src/main/java/physicsbruhh/sim/*.java src/simcheck/java/physicsbruhh/sim/*.java
          java -cp build/simcheck:src/main/resources physicsbruhh.sim.SimCheck --require-native
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -PskipCargo=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: physicsbruhh-jar
          path: build/libs/*.jar
          retention-days: 14
      - name: Game API and shader reference (commits tagged [api])
        if: contains(github.event.head_commit.message, '[api]')
        run: |
          JAR=$(ls build/moddev/artifacts/minecraft-patched-*.jar | grep -v sources | head -1)
          for f in include/oit_common.glsl include/oit_sample.glsl include/oit_depth_sample.glsl include/oit_add_transmittance.glsl include/oit_depth_bounds.glsl core/particle.fsh core/particle.vsh; do
            echo "API-BEGIN shader $f"; unzip -p "$JAR" "assets/minecraft/shaders/$f" 2>/dev/null || echo "(missing)"; echo "API-END"
          done
          for c in com.mojang.renderpearl.api.pipeline.RenderPipeline 'com.mojang.renderpearl.api.pipeline.RenderPipeline$Builder' 'com.mojang.renderpearl.api.pipeline.RenderPipeline$Snippet' com.mojang.renderpearl.api.pipeline.BindGroupLayout 'com.mojang.renderpearl.api.pipeline.BindGroupLayout$Builder' com.mojang.renderpearl.api.pipeline.BlendFunction com.mojang.renderpearl.api.pipeline.ColorTargetState com.mojang.renderpearl.api.pipeline.CompiledRenderPipeline com.mojang.renderpearl.api.pipeline.DepthStencilState com.mojang.renderpearl.api.pipeline.UniformType com.mojang.renderpearl.api.device.GpuDevice com.mojang.renderpearl.api.device.GpuBackend net.minecraft.client.renderer.BindGroupLayouts net.minecraft.client.renderer.oit.OitPipelineSet 'net.minecraft.client.renderer.oit.OitPipelineSet$Builder' net.minecraft.client.PreferredGraphicsApi net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.OrderedSubmitNodeCollector 'net.minecraft.client.renderer.SubmitNodeCollector$CustomGeometryRenderer' net.minecraft.client.player.LocalPlayer net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.world.phys.AABB net.minecraft.client.renderer.state.level.CameraRenderState net.minecraft.client.renderer.state.level.LevelRenderState net.minecraft.client.renderer.ShaderManager net.minecraft.world.level.block.SlimeBlock net.minecraft.world.level.block.HoneyBlock net.minecraft.client.resources.sounds.SimpleSoundInstance net.minecraft.client.sounds.SoundManager; do
            echo "API-BEGIN class $c"; javap -cp "$JAR" -public "$c" 2>&1 | head -300; echo "API-END"
          done
          echo "API-BEGIN grep SoundEvents"; javap -cp "$JAR" -public net.minecraft.sounds.SoundEvents | grep -E "HONEY|SLIME"; echo "API-END"
          echo "API-BEGIN grep Player"; javap -cp "$JAR" -public net.minecraft.world.entity.player.Player | grep -i -E "jump|fall|speed|range|abilities|crouch|sneak|Suppress"; echo "API-END"
          echo "API-BEGIN grep LivingEntity"; javap -cp "$JAR" -public net.minecraft.world.entity.LivingEntity | grep -i -E "jump|fall|speed|friction|onGround|resetFall"; echo "API-END"
          echo "API-BEGIN grep Entity"; javap -cp "$JAR" -public net.minecraft.world.entity.Entity | grep -i -E "DeltaMovement|fallDistance|resetFall|onGround|getBoundingBox| xo| yo| zo|xOld|getX\(|isSpectator|isShiftKeyDown|isSuppressingBounce|hurtMarked|getEyePosition|getViewVector|playSound|causeFallDamage|makeStuck|isSteppingCarefully|getKnownMovement|position\(|oldPosition"; echo "API-END"
          echo "API-BEGIN grep Level"; javap -cp "$JAR" -public net.minecraft.world.level.Level net.minecraft.client.multiplayer.ClientLevel net.minecraft.server.level.ServerLevel | grep -i -E "playLocalSound|playSound|addParticle|getEntities|levelEvent|sendParticles|playSeededSound"; echo "API-END"
          echo "API-BEGIN grep Minecraft"; javap -cp "$JAR" -public net.minecraft.client.Minecraft | grep -i -E "screen|hitResult|gameMode|getSoundManager|particleEngine|getDeltaTracker|gameRenderer|gui"; echo "API-END"
          echo "API-BEGIN code RenderPipelines"; javap -cp "$JAR" -p -c net.minecraft.client.renderer.RenderPipelines | grep -E "ldc|getstatic|putstatic|invoke" | sed -E 's/^ +[0-9]+: //' | head -700; echo "API-END"
          echo "API-BEGIN code BindGroupLayouts"; javap -cp "$JAR" -p -c net.minecraft.client.renderer.BindGroupLayouts | grep -E "ldc|getstatic|putstatic|invoke" | sed -E 's/^ +[0-9]+: //' | head -200; echo "API-END"
          echo "API-BEGIN code Options"; javap -cp "$JAR" -p -c net.minecraft.client.Options | grep -E "ldc" | grep -i -E "raphics|ransparen|oit|backend" | head -40; echo "API-END"
      - name: In-game self test (dedicated server, real pistons)
        timeout-minutes: 12
        run: |
          mkdir -p run/selftest
          echo "eula=true" > run/selftest/eula.txt
          printf 'level-type=minecraft\\:flat\nspawn-protection=0\nonline-mode=false\nmax-tick-time=-1\n' > run/selftest/server.properties
          ./gradlew runSelfTest -PskipCargo=true 2>&1 | tee selftest.log | grep -E "SELFTEST|Exception|ERROR|Done \(" || true
          if ! grep -q "SELFTEST PASS" selftest.log; then
            # say why: the end of the server's own crash report, if it wrote one
            for f in run/selftest/crash-reports/*.txt; do [ -e "$f" ] && sed -n 1,60p "$f"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: selftest.log
          retention-days: 7
      - name: Which runner image this is (the packages kept for it)
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: debs-${{ steps.image.outputs.name }}
          restore-keys: debs-
      - name: Client smoke test (software rendering, screenshots)
        timeout-minutes: 55
        run: |
          # The runners' name service drops out for the package mirrors now and then, for many minutes at a time. What came
          # down once is kept (the cache above) and installed from there; the mirrors are only asked when that does not work.
          mkdir -p ~/apt-debs
          if ls ~/apt-debs/*.deb > /dev/null 2>&1 && sudo dpkg -i ~/apt-debs/*.deb > /dev/null 2>&1; then
            echo "packages installed from the cache ($(ls ~/apt-debs | wc -l))"
          else
            for try in 1 2 3; do
              if sudo timeout 150 apt-get update -qq && sudo timeout 300 apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libgles2 mesa-vulkan-drivers imagemagick x11-apps > /dev/null; then
                cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2> /dev/null || true
                echo "packages installed from the mirrors, $(ls ~/apt-debs | wc -l) kept for next time"
                break
              fi
              echo "the package mirrors did not answer (try $try)"
              # the mirrors the runner is set up with all hang off one name; the second and third tries go to others
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://mirrors.kernel.org/ubuntu/\tpriority:1\nhttp://ftp.halifax.rwth-aachen.de/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
              fi
              sleep 5
            done
          fi
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          # one run of the client test: name, extra lines for options.txt, extra environment
          run_client() {
            name=$1
            rm -rf run/clienttest/saves/selftest run/clienttest/options.txt
            mkdir -p run/clienttest/saves "shots/$name"
            cp -r run/selftest/world run/clienttest/saves/selftest
            printf 'pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nskipMultiplayerWarning:true\njoinedFirstServer:true\n%b' "$2" > run/clienttest/options.txt
            log="clienttest-$name.log"; : > "$log"
            (
              while true; do
                if grep -q "CLIENTTEST world joined" "$log"; then
                  xwd -root -silent -display :99 -out "shots/$name/scene_$(date +%H%M%S_%3N).xwd" 2> /dev/null || true
                  sleep 0.35
                else
                  sleep 1
                fi
              done
            ) &
            SHOTS=$!
            env $3 timeout 600 ./gradlew runClientTest -PskipCargo=true > "$log" 2>&1 || true
            kill $SHOTS 2> /dev/null || true
            for f in shots/$name/*.xwd; do [ -e "$f" ] || continue; convert "xwd:$f" -quality 88 "${f%.xwd}.jpg" 2> /dev/null || true; rm -f "$f"; done
            echo "=== client test: $name"
            grep -E "CLIENTTEST (stage|trace|in honey|bounced|dispensers|bottle|honey bottle|slime ball|wheel|thickness|by hand|gas|final|PASS|FAIL)|Using the|graphics backend|Failed to create backend|Goo .*(stopped|failed|error)|Gas: |physicsbruhh.*(rror|ailed)|pipeline/g|core/g|shader pack|Iris is here" "$log" | cut -c1-900 | head -170 || true
            grep -A 14 "liquid look of the goo failed" "$log" | head -40 || true
            echo "screenshots: $(ls shots/$name | wc -l)"
          }
          run_client vulkan "" ""
          # (this one also has smoke and fire on a finer grid: 6 cells to the block instead of 4)
          run_client oit "improvedTransparency:true\n" "PHYSICSBRUHH_GAS=medium"
          run_client opengl 'preferredGraphicsBackend:"opengl"\n' "SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1"
          # (this one also has smoke and fire computed by the Rust core instead of the graphics card)
          run_client surface "" "JAVA_TOOL_OPTIONS=-Dphysicsbruhh.liquid=false PHYSICSBRUHH_GAS_SOLVER=cpu"
          # (this one also has smoke and fire computed by compute shaders, on Vulkan)
          run_client plain "" "JAVA_TOOL_OPTIONS=-Dphysicsbruhh.shader=false PHYSICSBRUHH_GAS_SOLVER=compute"
          # the hand-over to shader packs, with no pack: goo as the game's own translucent geometry
          run_client packs "" "JAVA_TOOL_OPTIONS=-Dphysicsbruhh.packs=true"
          # smoke and fire computed by compute shaders on OpenGL (the game asks for 3.3; the programs need what came with 4.5)
          run_client glcompute 'preferredGraphicsBackend:"opengl"\n' "SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1 PHYSICSBRUHH_GAS_SOLVER=compute"
          echo "=== summary"
          for name in vulkan oit opengl surface plain packs glcompute; do
            echo "$name: $(grep -o 'Using graphics backend [A-Za-z]*' clienttest-$name.log | head -1) / $(grep -o 'CLIENTTEST \(PASS\|FAIL.*\)' clienttest-$name.log | head -1)"
          done
          # the default run and the two fallbacks of our own making must pass; OpenGL depends on what the runner can do
          grep -q "CLIENTTEST PASS" clienttest-vulkan.log
          grep -q "CLIENTTEST PASS" clienttest-oit.log
          grep -q "CLIENTTEST PASS" clienttest-surface.log
          grep -q "CLIENTTEST PASS" clienttest-plain.log
          grep -q "CLIENTTEST PASS" clienttest-packs.log
      - name: Screenshots as text (commits tagged [shots])
        if: always() && contains(github.event.head_commit.message, '[shots]')
        run: |
          for name in vulkan oit opengl surface plain packs glcompute; do
            n=0
            # every second frame of the default run, every sixth of the others
            case "$name" in vulkan) every=2 ;; *) every=6 ;; esac
            for f in shots/$name/*.jpg; do
              [ -e "$f" ] || continue
              n=$((n + 1))
              if [ $((n % every)) -ne 0 ]; then continue; fi
              echo "SHOT-BEGIN ${name}_$(basename "$f")"
              convert "$f" -resize 854x480 -quality 72 jpg:- | base64 -w 160
              echo "SHOT-END"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clienttest
          path: |
            clienttest-*.log
            shots/
          retention-days: 7
          if-no-files-found: ignore
