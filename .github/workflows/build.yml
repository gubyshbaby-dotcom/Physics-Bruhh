name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, platform: linux-x86_64,   lib: libphysicsbruhh_native.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   platform: windows-x86_64, lib: physicsbruhh_native.dll }
          - { os: macos-latest,   target: aarch64-apple-darwin,     platform: macos-aarch64,  lib: libphysicsbruhh_native.dylib }
          - { os: macos-latest,   target: x86_64-apple-darwin,      platform: macos-x86_64,   lib: libphysicsbruhh_native.dylib }
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('native/Cargo.toml') }}
      - name: Test the simulation core
        if: matrix.platform == 'linux-x86_64'
        working-directory: native
        run: cargo test --release
      - name: Build
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          mkdir -p stage/natives/${{ matrix.platform }}
          cp native/target/${{ matrix.target }}/release/${{ matrix.lib }} stage/natives/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: stage/
          retention-days: 7

  mod:
    name: Mod jar (NeoForge)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: src/main/resources/
      - name: List bundled natives
        run: find src/main/resources/natives -type f | sort
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Java and Rust simulations agree
        run: |
          mkdir -p build/simcheck
          javac -nowarn -d build/simcheck src/main/java/physicsbruhh/sim/*.java src/simcheck/java/physicsbruhh/sim/*.java
          java -cp build/simcheck:src/main/resources physicsbruhh.sim.SimCheck --require-native
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -PskipCargo=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: physicsbruhh-jar
          path: build/libs/*.jar
          retention-days: 14
      - name: Game API and shader reference (commits tagged [api])
        if: contains(github.event.head_commit.message, '[api]')
        run: |
          JAR=$(ls build/moddev/artifacts/minecraft-patched-*.jar | grep -v sources | head -1)
          for f in include/oit_common.glsl include/oit_sample.glsl include/oit_depth_sample.glsl include/oit_add_transmittance.glsl include/oit_depth_bounds.glsl core/particle.fsh core/particle.vsh; do
            echo "API-BEGIN shader $f"; unzip -p "$JAR" "assets/minecraft/shaders/$f" 2>/dev/null || echo "(missing)"; echo "API-END"
          done
          for c in com.mojang.renderpearl.api.pipeline.RenderPipeline 'com.mojang.renderpearl.api.pipeline.RenderPipeline$Builder' 'com.mojang.renderpearl.api.pipeline.RenderPipeline$Snippet' com.mojang.renderpearl.api.pipeline.BindGroupLayout 'com.mojang.renderpearl.api.pipeline.BindGroupLayout$Builder' com.mojang.renderpearl.api.pipeline.BlendFunction com.mojang.renderpearl.api.pipeline.ColorTargetState com.mojang.renderpearl.api.pipeline.CompiledRenderPipeline com.mojang.renderpearl.api.pipeline.DepthStencilState com.mojang.renderpearl.api.pipeline.UniformType com.mojang.renderpearl.api.device.GpuDevice com.mojang.renderpearl.api.device.GpuBackend net.minecraft.client.renderer.BindGroupLayouts net.minecraft.client.renderer.oit.OitPipelineSet 'net.minecraft.client.renderer.oit.OitPipelineSet$Builder' net.minecraft.client.PreferredGraphicsApi net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.OrderedSubmitNodeCollector 'net.minecraft.client.renderer.SubmitNodeCollector$CustomGeometryRenderer' net.minecraft.client.player.LocalPlayer net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.world.phys.AABB net.minecraft.client.renderer.state.level.CameraRenderState net.minecraft.client.renderer.state.level.LevelRenderState net.minecraft.client.renderer.ShaderManager net.minecraft.world.level.block.SlimeBlock net.minecraft.world.level.block.HoneyBlock net.minecraft.client.resources.sounds.SimpleSoundInstance net.minecraft.client.sounds.SoundManager; do
            echo "API-BEGIN class $c"; javap -cp "$JAR" -public "$c" 2>&1 | head -300; echo "API-END"
          done
          echo "API-BEGIN grep SoundEvents"; javap -cp "$JAR" -public net.minecraft.sounds.SoundEvents | grep -E "HONEY|SLIME"; echo "API-END"
          echo "API-BEGIN grep Player"; javap -cp "$JAR" -public net.minecraft.world.entity.player.Player | grep -i -E "jump|fall|speed|range|abilities|crouch|sneak|Suppress"; echo "API-END"
          echo "API-BEGIN grep LivingEntity"; javap -cp "$JAR" -public net.minecraft.world.entity.LivingEntity | grep -i -E "jump|fall|speed|friction|onGround|resetFall"; echo "API-END"
          echo "API-BEGIN grep Entity"; javap -cp "$JAR" -public net.minecraft.world.entity.Entity | grep -i -E "DeltaMovement|fallDistance|resetFall|onGround|getBoundingBox| xo| yo| zo|xOld|getX\(|isSpectator|isShiftKeyDown|isSuppressingBounce|hurtMarked|getEyePosition|getViewVector|playSound|causeFallDamage|makeStuck|isSteppingCarefully|getKnownMovement|position\(|oldPosition"; echo "API-END"
          echo "API-BEGIN grep Level"; javap -cp "$JAR" -public net.minecraft.world.level.Level net.minecraft.client.multiplayer.ClientLevel net.minecraft.server.level.ServerLevel | grep -i -E "playLocalSound|playSound|addParticle|getEntities|levelEvent|sendParticles|playSeededSound"; echo "API-END"
          echo "API-BEGIN grep Minecraft"; javap -cp "$JAR" -public net.minecraft.client.Minecraft | grep -i -E "screen|hitResult|gameMode|getSoundManager|particleEngine|getDeltaTracker|gameRenderer|gui"; echo "API-END"
          echo "API-BEGIN code RenderPipelines"; javap -cp "$JAR" -p -c net.minecraft.client.renderer.RenderPipelines | grep -E "ldc|getstatic|putstatic|invoke" | sed -E 's/^ +[0-9]+: //' | head -700; echo "API-END"
          echo "API-BEGIN code BindGroupLayouts"; javap -cp "$JAR" -p -c net.minecraft.client.renderer.BindGroupLayouts | grep -E "ldc|getstatic|putstatic|invoke" | sed -E 's/^ +[0-9]+: //' | head -200; echo "API-END"
          echo "API-BEGIN code Options"; javap -cp "$JAR" -p -c net.minecraft.client.Options | grep -E "ldc" | grep -i -E "raphics|ransparen|oit|backend" | head -40; echo "API-END"
      - name: In-game self test (dedicated server, real pistons)
        timeout-minutes: 12
        run: |
          mkdir -p run/selftest
          echo "eula=true" > run/selftest/eula.txt
          printf 'level-type=minecraft\\:flat\nspawn-protection=0\nonline-mode=false\nmax-tick-time=-1\n' > run/selftest/server.properties
          ./gradlew runSelfTest -PskipCargo=true 2>&1 | tee selftest.log | grep -E "SELFTEST|Exception|ERROR|Done \(" || true
          grep -q "SELFTEST PASS" selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: selftest.log
          retention-days: 7
      - name: Client smoke test (software rendering, screenshots)
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers imagemagick x11-apps > /dev/null
          mkdir -p run/clienttest/saves shots
          cp -r run/selftest/world run/clienttest/saves/selftest
          printf 'pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nskipMultiplayerWarning:true\njoinedFirstServer:true\n' > run/clienttest/options.txt
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          touch clienttest.log
          (
            n=0
            while true; do
              n=$((n + 1))
              if grep -q "CLIENTTEST world joined" clienttest.log; then
                xwd -root -silent -display :99 -out "shots/scene_$(date +%H%M%S_%3N).xwd" 2> /dev/null || true
                sleep 0.35
              else
                if [ $((n % 20)) -eq 0 ]; then xwd -root -silent -display :99 -out "shots/boot_$(date +%H%M%S_%3N).xwd" 2> /dev/null || true; fi
                sleep 1
              fi
            done
          ) &
          SHOTS=$!
          timeout 780 ./gradlew runClientTest -PskipCargo=true > clienttest.log 2>&1 || true
          kill $SHOTS 2> /dev/null || true
          for f in shots/*.xwd; do convert "xwd:$f" -quality 88 "${f%.xwd}.jpg" 2> /dev/null || true; rm -f "$f"; done
          grep -E "CLIENTTEST|Using the|graphics backend|Goo simulation stopped" clienttest.log | head -80 || true
          echo "screenshots: $(ls shots | wc -l)"
          grep -q "CLIENTTEST PASS" clienttest.log
      - name: Screenshots as text (commits tagged [shots])
        if: always() && contains(github.event.head_commit.message, '[shots]')
        run: |
          for f in shots/*.jpg; do
            echo "SHOT-BEGIN $(basename "$f")"
            convert "$f" -resize 854x480 -quality 72 jpg:- | base64 -w 160
            echo "SHOT-END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clienttest
          path: |
            clienttest.log
            shots/
          retention-days: 7
          if-no-files-found: ignore
