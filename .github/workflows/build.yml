name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, platform: linux-x86_64,   lib: libphysicsbruhh_native.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   platform: windows-x86_64, lib: physicsbruhh_native.dll }
          - { os: macos-latest,   target: aarch64-apple-darwin,     platform: macos-aarch64,  lib: libphysicsbruhh_native.dylib }
          - { os: macos-latest,   target: x86_64-apple-darwin,      platform: macos-x86_64,   lib: libphysicsbruhh_native.dylib }
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('native/Cargo.toml') }}
      - name: Test the simulation core
        if: matrix.platform == 'linux-x86_64'
        working-directory: native
        run: cargo test --release
      - name: Build
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          mkdir -p stage/natives/${{ matrix.platform }}
          cp native/target/${{ matrix.target }}/release/${{ matrix.lib }} stage/natives/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: stage/
          retention-days: 7

  mod:
    name: Mod jar (NeoForge)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: src/main/resources/
      - name: List bundled natives
        run: find src/main/resources/natives -type f | sort
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Java and Rust simulations agree
        run: |
          mkdir -p build/simcheck
          javac -nowarn -d build/simcheck src/main/java/physicsbruhh/sim/*.java src/simcheck/java/physicsbruhh/sim/*.java
          java -cp build/simcheck:src/main/resources physicsbruhh.sim.SimCheck --require-native
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -PskipCargo=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: physicsbruhh-jar
          path: build/libs/*.jar
          retention-days: 14
      - name: In-game self test (dedicated server, real pistons)
        timeout-minutes: 12
        run: |
          mkdir -p run/selftest
          echo "eula=true" > run/selftest/eula.txt
          printf 'level-type=minecraft\\:flat\nspawn-protection=0\nonline-mode=false\nmax-tick-time=-1\n' > run/selftest/server.properties
          ./gradlew runSelfTest -PskipCargo=true 2>&1 | tee selftest.log | grep -E "SELFTEST|Exception|ERROR|Done \(" || true
          grep -q "SELFTEST PASS" selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: selftest.log
          retention-days: 7
      - name: Client smoke test (software rendering, screenshots)
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers imagemagick > /dev/null
          mkdir -p run/clienttest/saves shots
          cp -r run/selftest/world run/clienttest/saves/selftest
          printf 'pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nskipMultiplayerWarning:true\njoinedFirstServer:true\n' > run/clienttest/options.txt
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          touch clienttest.log
          (
            n=0
            while true; do
              n=$((n + 1))
              if grep -q "CLIENTTEST world joined" clienttest.log; then
                import -display :99 -window root "shots/scene_$(date +%H%M%S).png" 2> /dev/null || true
                sleep 1
              else
                if [ $((n % 20)) -eq 0 ]; then import -display :99 -window root "shots/boot_$(date +%H%M%S).png" 2> /dev/null || true; fi
                sleep 1
              fi
            done
          ) &
          SHOTS=$!
          timeout 780 ./gradlew runClientTest -PskipCargo=true > clienttest.log 2>&1 || true
          kill $SHOTS 2> /dev/null || true
          grep -E "CLIENTTEST|PhysicsBruhh|Using the|Backend|OpenGL|Vulkan|Exception|ERROR" clienttest.log | head -120 || true
          ls shots | wc -l
          grep -q "CLIENTTEST PASS" clienttest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clienttest
          path: |
            clienttest.log
            shots/
          retention-days: 7
          if-no-files-found: ignore
