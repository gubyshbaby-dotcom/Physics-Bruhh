[package]
name = "physicsbruhh_native"
version = "0.1.0"
edition = "2021"
description = "Honey / slime particle simulation core for the Physics Bruhh mod"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
